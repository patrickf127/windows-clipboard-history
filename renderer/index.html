<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>剪貼簿歷史</title>
  <!-- 使用 system 字體，輕量化 -->
  <style>
    /* ===== Reset & 基礎 ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #7bb8f7;       /* 淡藍色主色 */
      --primary-light: #b8d8fc;
      --primary-bg: #e8f1fd;    /* 更淡的背景藍 */
      --bg: #f5f8fe;
      --card-bg: #ffffff;
      --border: #dce6f0;
      --text: #2c3e50;
      --text-secondary: #7f8c9b;
      --shadow: rgba(123, 184, 247, 0.15);
      --radius: 12px;
      --radius-sm: 8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: transparent;
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* ===== Window Drag ===== */
    .drag-region {
      -webkit-app-region: drag;
    }
    .no-drag {
      -webkit-app-region: no-drag;
    }

    /* ===== 主容器 ===== */
    .window {
      height: 100vh;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    }

    /* ===== 頂部標題欄 ===== */
    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px 10px;
      -webkit-app-region: drag;
    }
    .titlebar h1 {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.5px;
    }
    .titlebar h1 span { font-size: 18px; margin-right: 4px; }
    .close-btn {
      -webkit-app-region: no-drag;
      width: 28px; height: 28px;
      border: none;
      background: transparent;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s;
    }
    .close-btn:hover { background: #e8e8e8; color: #e74c3c; }

    /* ===== 搜索框 ===== */
    .search-box {
      padding: 0 14px 12px;
      -webkit-app-region: no-drag;
    }
    .search-box input {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      background: var(--card-bg);
      color: var(--text);
      outline: none;
      transition: border-color .2s;
    }
    .search-box input:focus {
      border-color: var(--primary);
    }
    .search-box input::placeholder {
      color: #aab7c9;
    }

    /* ===== 卡片列表 ===== */
    .list-container {
      flex: 1;
      overflow-y: auto;
      padding: 0 14px 14px;
    }
    .list-container::-webkit-scrollbar { width: 5px; }
    .list-container::-webkit-scrollbar-track { background: transparent; }
    .list-container::-webkit-scrollbar-thumb {
      background: var(--primary-light);
      border-radius: 3px;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-secondary);
      font-size: 14px;
      gap: 8px;
    }
    .empty-state .icon { font-size: 48px; opacity: .5; }

    /* ===== 卡片 ===== */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 8px;
      transition: box-shadow .2s;
      position: relative;
    }
    .card:hover {
      box-shadow: 0 2px 12px var(--shadow);
    }
    .card.pinned {
      border-left: 3px solid var(--primary);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-time {
      font-size: 11px;
      color: var(--text-secondary);
    }
    .card-type-badge {
      font-size: 10px;
      padding: 1px 7px;
      border-radius: 10px;
      font-weight: 600;
    }
    .badge-text { background: #e3f2fd; color: #1976d2; }
    .badge-image { background: #fce4ec; color: #c62828; }
    .badge-pin { color: var(--primary); font-size: 12px; }

    .card-actions {
      display: flex;
      gap: 2px;
      opacity: 0;
      transition: opacity .15s;
    }
    .card:hover .card-actions { opacity: 1; }

    .card-actions button {
      width: 26px; height: 26px;
      border: none;
      background: transparent;
      border-radius: 50%;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s;
      color: var(--text-secondary);
    }
    .card-actions button:hover {
      background: #f0f2f5;
    }
    .card-actions .pin-btn:hover { color: var(--primary); }
    .card-actions .pin-btn.active { color: var(--primary); opacity: 1; }
    .card-actions .delete-btn:hover { color: #e74c3c; }

    /* 文字內容 */
    .card-text {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
      word-break: break-all;
      max-height: 100px;
      overflow: hidden;
      cursor: pointer;
      padding-right: 4px;
    }
    .card-text:hover { color: var(--primary); }

    /* 圖片內容 */
    .card-image-wrapper {
      cursor: pointer;
    }
    .card-image-wrapper img {
      max-width: 100%;
      max-height: 180px;
      border-radius: var(--radius-sm);
      display: block;
      object-fit: contain;
      background: #f5f5f5;
    }

    /* Toast */
    .toast {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #333;
      color: #fff;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 13px;
      opacity: 0;
      transition: all .3s;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
<div class="window">
  <!-- 標題欄 -->
  <div class="titlebar">
    <h1><span>📋</span>剪貼簿歷史</h1>
    <button class="close-btn no-drag" onclick="window.api.hideWindow()" title="最小化到托盤">✕</button>
  </div>

  <!-- 搜索框 -->
  <div class="search-box no-drag">
    <input type="text" id="searchInput" placeholder="🔍 搜尋文字紀錄..." />
  </div>

  <!-- 卡片列表 -->
  <div class="list-container" id="listContainer">
    <div class="empty-state">
      <div class="icon">📋</div>
      <p>暫無剪貼簿紀錄</p>
      <p style="font-size:12px;">複製文字或圖片後就會出現在這裡</p>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
let allItems = [];

// ===== 載入 =====
async function loadHistory() {
  const container = document.getElementById('listContainer');
  allItems = await window.api.getHistory();

  if (!allItems.length) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">📋</div>
        <p>暫無剪貼簿紀錄</p>
        <p style="font-size:12px;">複製文字或圖片後就會出現在這裡</p>
      </div>`;
    return;
  }

  container.innerHTML = allItems.map(item => renderCard(item)).join('');

  // 綁定點擊事件
  container.querySelectorAll('.card-text').forEach(el => {
    el.addEventListener('click', () => copyItem(el.dataset.id, 'text', el.dataset.content));
  });
  container.querySelectorAll('.card-image-wrapper').forEach(el => {
    el.addEventListener('click', () => copyItem(el.dataset.id, 'image', el.dataset.data));
  });
  container.querySelectorAll('.pin-btn').forEach(el => {
    el.addEventListener('click', () => togglePinItem(el.dataset.id));
  });
  container.querySelectorAll('.delete-btn').forEach(el => {
    el.addEventListener('click', () => deleteItem(el.dataset.id));
  });
}

function renderCard(item) {
  const time = formatTime(item.created_at);
  const isPinned = item.is_pinned === 1;

  if (item.type === 'text') {
    const text = escapeHtml(item.text_content);
    const shortText = text.length > 300 ? text.slice(0, 300) + '…' : text;
    return `
      <div class="card ${isPinned ? 'pinned' : ''}">
        <div class="card-header">
          <div class="card-meta">
            ${isPinned ? '<span class="badge-pin">📌</span>' : ''}
            <span class="card-type-badge badge-text">文字</span>
            <span class="card-time">${time}</span>
          </div>
          <div class="card-actions">
            <button class="pin-btn ${isPinned ? 'active' : ''}" data-id="${item.id}" title="${isPinned ? '取消置頂' : '置頂'}">📌</button>
            <button class="delete-btn" data-id="${item.id}" title="刪除">🗑️</button>
          </div>
        </div>
        <div class="card-text" data-id="${item.id}" data-content="${escapeAttr(item.text_content)}">${shortText}</div>
      </div>`;
  }

  if (item.type === 'image') {
    return `
      <div class="card ${isPinned ? 'pinned' : ''}">
        <div class="card-header">
          <div class="card-meta">
            ${isPinned ? '<span class="badge-pin">📌</span>' : ''}
            <span class="card-type-badge badge-image">圖片</span>
            <span class="card-time">${time}</span>
          </div>
          <div class="card-actions">
            <button class="pin-btn ${isPinned ? 'active' : ''}" data-id="${item.id}" title="${isPinned ? '取消置頂' : '置頂'}">📌</button>
            <button class="delete-btn" data-id="${item.id}" title="刪除">🗑️</button>
          </div>
        </div>
        <div class="card-image-wrapper" data-id="${item.id}" data-data="${item.image_data}">
          <img src="data:image/png;base64,${item.image_data}" alt="剪貼簿圖片" />
        </div>
      </div>`;
  }
}

// ===== 操作 =====
async function copyItem(id, type, content) {
  // 對於文字，傳原始內容
  if (type === 'text') {
    await window.api.copyToClipboard(content, 'text');
  } else {
    await window.api.copyToClipboard(content, 'image');
  }
  showToast('✅ 已複製到剪貼簿');
}

async function togglePinItem(id) {
  await window.api.togglePin(id);
  await loadHistory();
}

async function deleteItem(id) {
  await window.api.deleteItem(id);
  await loadHistory();
  showToast('🗑️ 已刪除');
}

// ===== 搜索 =====
let searchTimer;
document.getElementById('searchInput').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  const keyword = e.target.value.trim();
  searchTimer = setTimeout(async () => {
    if (!keyword) {
      await loadHistory();
      return;
    }
    const results = await window.api.searchHistory(keyword);
    const container = document.getElementById('listContainer');
    if (!results.length) {
      container.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>沒有找到相符的紀錄</p></div>`;
      return;
    }
    container.innerHTML = results.map(item => renderCard(item)).join('');
    container.querySelectorAll('.card-text').forEach(el => {
      el.addEventListener('click', () => copyItem(el.dataset.id, 'text', el.dataset.content));
    });
    container.querySelectorAll('.pin-btn').forEach(el => {
      el.addEventListener('click', () => togglePinItem(el.dataset.id));
    });
    container.querySelectorAll('.delete-btn').forEach(el => {
      el.addEventListener('click', () => deleteItem(el.dataset.id));
    });
  }, 250);
});

// ===== 自動重新整理 =====
window.api.onRefreshHistory(() => {
  loadHistory();
});

// ===== 工具函式 =====
function formatTime(dateStr) {
  if (!dateStr) return '';
  // dateStr 格式: "2026-07-22 14:30:00"
  const parts = dateStr.split(' ');
  if (parts.length < 2) return dateStr;
  const datePart = parts[0].slice(5); // "07-22"
  const timePart = parts[1].slice(0, 5); // "14:30"
  return `${datePart} ${timePart}`;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function escapeAttr(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1500);
}

// 初始載入
loadHistory();
</script>
</body>
</html>
